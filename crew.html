<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bot Planet — Crew</title>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
<style>
  :root {
    --bg: #15132b;
    --bg2: #1c1a38;
    --card: #24214a;
    --card2: #2c2958;
    --line: rgba(255, 255, 255, .08);
    --ink: #f3f0fc;
    --ink-soft: #a9a3c8;
    --ink-faint: #736d96;
    --orange: #d97757;
    --orange-hot: #ff7a45;
    --mint: #5fbf8f;
    --sky: #8cc8f5;
    --idle: #b9b3cc;
    --spring: cubic-bezier(.3, 1.32, .5, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 70% -10%, #2d2860 0%, var(--bg) 55%);
    color: var(--ink); font: 13px/1.4 ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  /* ── header ── */
  header { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid var(--line); flex: none; }
  /* inside the Electron window the title bar is hidden: leave room for the traffic lights and let the header drag the window */
  .electron header { padding-left: 86px; -webkit-app-region: drag; }
  .electron header button, .electron header input, .electron header select { -webkit-app-region: no-drag; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .brand .planet { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c3e6a4, #5fb879 45%, #3a7fa0 80%); box-shadow: 0 0 0 3px rgba(183, 214, 255, .14); }
  .tabs { display: flex; gap: 2px; padding: 3px; background: rgba(0, 0, 0, .22); border-radius: 11px; }
  .tabs button { border: 0; background: none; padding: 5px 12px; border-radius: 8px; font-weight: 700; color: var(--ink-soft); display: flex; gap: 6px; align-items: center; }
  .tabs button.on { background: var(--card2); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
  .tabs .n { font-size: 10.5px; padding: 0 6px; border-radius: 999px; background: rgba(255, 255, 255, .1); }
  .tabs .n.alert { background: var(--orange-hot); color: #fff; }
  .spacer { flex: 1; }
  #news { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  #news .txt.new { color: #ffd2a8; }
  #news .txt.calm { color: var(--ink-soft); font-weight: 600; }
  .btn { border: 0; border-radius: 9px; padding: 5px 11px; background: rgba(255, 255, 255, .09); font-weight: 700; font-size: 12px; transition: background .15s; }
  .btn:hover { background: rgba(255, 255, 255, .16); }
  .btn.primary { background: var(--orange); color: #fff; }
  .btn.primary:hover { background: #e4855f; }
  .btn.small { padding: 3px 9px; font-size: 11px; border-radius: 7px; }
  #usage { display: flex; gap: 10px; color: var(--ink-soft); font-size: 11px; font-weight: 700; }
  #usage .u { display: flex; align-items: center; gap: 5px; }
  #usage .bar { width: 38px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .12); overflow: hidden; }
  #usage .bar i { display: block; height: 100%; background: var(--mint); border-radius: 3px; }
  #usage .bar i.warn { background: #f0b65a; } #usage .bar i.hot { background: var(--orange-hot); }
  #conn { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); flex: none; }
  #conn.on { background: var(--mint); box-shadow: 0 0 0 3px rgba(95, 191, 143, .18); }

  /* ── projects view ── */
  main { flex: 1; min-height: 0; display: flex; }
  #list { width: 330px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: rgba(0, 0, 0, .12); }
  .tools { display: flex; gap: 6px; padding: 12px 12px 8px; }
  .tools input, .tools select { background: rgba(255, 255, 255, .07); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; outline: none; min-width: 0; }
  .tools input { flex: 1; }
  .tools input:focus, .tools select:focus { border-color: rgba(140, 200, 245, .5); }
  .tools select { appearance: none; padding-right: 22px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); background-position: calc(100% - 12px) 50%, calc(100% - 8px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }
  .tools select option { background: var(--bg2); }
  #plist { list-style: none; margin: 0; padding: 2px 8px 12px; overflow-y: auto; flex: 1; }
  .row { display: grid; grid-template-columns: 26px 1fr auto; gap: 2px 10px; align-items: center; padding: 8px 10px; border-radius: 12px; cursor: pointer; transition: background .12s; }
  .row + .row { margin-top: 2px; }
  .row:hover { background: rgba(255, 255, 255, .05); }
  .row.sel { background: var(--card2); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07); }
  .row.hidden-p .nm, .row.hidden-p .sw { opacity: .5; }
  .sw { grid-row: span 2; width: 26px; height: 26px; border-radius: 9px; background: var(--c); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18); position: relative; }
  .sw.off { background: repeating-linear-gradient(135deg, var(--c) 0 4px, transparent 4px 7px); }
  .nm { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .nm span { overflow: hidden; text-overflow: ellipsis; }
  .sub { grid-column: 2 / 4; display: flex; align-items: center; gap: 4px; color: var(--ink-faint); font-size: 11px; white-space: nowrap; overflow: hidden; }
  .chip { font-size: 9.5px; font-weight: 800; letter-spacing: .02em; padding: 1px 6px; border-radius: 999px; background: rgba(255, 255, 255, .08); color: var(--ink-soft); }
  .chip.code { background: rgba(140, 200, 245, .14); color: #a9d6f7; }
  .chip.cowork { background: rgba(217, 119, 87, .16); color: #f1a487; }
  .chip.hist { background: rgba(185, 179, 204, .12); }
  .chip.hid { background: rgba(255, 255, 255, .05); color: var(--ink-faint); }
  .newb { font-size: 9px; font-weight: 900; letter-spacing: .06em; padding: 1px 6px; border-radius: 999px; background: linear-gradient(135deg, #ff9a5a, #ff6f61); color: #fff; flex: none; box-shadow: 0 0 10px rgba(255, 122, 69, .35); }
  .live { font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .live.help { background: var(--orange-hot); color: #fff; }
  .live.working { background: rgba(140, 200, 245, .18); color: var(--sky); }
  .live.idle { background: rgba(255, 255, 255, .07); color: var(--ink-soft); }
  .empty-list { color: var(--ink-faint); text-align: center; padding: 40px 20px; }

  #detail { flex: 1; min-width: 0; overflow-y: auto; padding: 16px 18px 18px; }
  .grid { display: grid; grid-template-columns: 240px 1fr; gap: 14px; }
  .grid.bottom { grid-template-columns: 330px 1fr; margin-top: 14px; }
  .card { background: var(--card); border-radius: 18px; padding: 14px 16px; box-shadow: 0 6px 24px rgba(10, 6, 30, .25), inset 0 1px 0 rgba(255, 255, 255, .05); min-width: 0; }
  .card h3 { margin: 0 0 8px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; }
  .card h3 .r { margin-left: auto; text-transform: none; letter-spacing: 0; }
  .preview { padding: 0; overflow: hidden; position: relative; background: radial-gradient(ellipse at 50% 35%, #3d3878 0%, var(--card) 70%); }
  #preview3d { height: 280px; cursor: grab; }
  #preview3d canvas, #globe3d canvas { display: block; }
  .pv-cap { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 11px; color: var(--ink-soft); pointer-events: none; }
  .namerow { display: flex; align-items: center; gap: 10px; }
  .namerow .sw { width: 30px; height: 30px; grid-row: auto; flex: none; }
  #dname { flex: 1; min-width: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; background: transparent; border: 1px solid transparent; border-radius: 9px; padding: 2px 8px; margin-left: -8px; outline: none; }
  #dname:hover { border-color: var(--line); }
  #dname:focus { border-color: rgba(140, 200, 245, .55); background: rgba(0, 0, 0, .18); }
  .meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin: 6px 0 4px; color: var(--ink-faint); font-size: 11.5px; }
  .field { display: grid; grid-template-columns: 82px 1fr; align-items: center; gap: 10px; margin-top: 11px; }
  .field > label { font-size: 11.5px; color: var(--ink-soft); font-weight: 700; }
  .swatches { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .swatches button { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 0; background: var(--c); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18); transition: transform .2s var(--spring); position: relative; }
  .swatches button:hover { transform: scale(1.12); }
  .swatches button.on { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px #fff; }
  .swatches button.taken::after { content: ""; position: absolute; right: -1px; top: -1px; width: 7px; height: 7px; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 2px var(--ink-faint); }
  .opts { display: flex; gap: 5px; flex-wrap: wrap; }
  .opt { border: 1px solid var(--line); background: rgba(255, 255, 255, .04); border-radius: 9px; padding: 3px 8px; font-size: 11.5px; font-weight: 700; color: var(--ink-soft); display: flex; align-items: center; gap: 4px; transition: background .12s, color .12s; }
  .opt:hover { background: rgba(255, 255, 255, .09); color: var(--ink); }
  .opt.on { background: var(--ink); color: #24214a; border-color: transparent; }
  .opt .e { font-size: 13px; line-height: 1; }
  .opt.auto { font-style: normal; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 700; font-size: 12px; color: var(--ink-soft); }
  .toggle input { display: none; }
  .toggle .k { width: 34px; height: 20px; border-radius: 999px; background: rgba(255, 255, 255, .14); position: relative; transition: background .15s; }
  .toggle .k::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s var(--spring); }
  .toggle input:checked + .k { background: var(--orange); }
  .toggle input:checked + .k::after { transform: translateX(14px); }

  .spot { position: relative; }
  #globe3d { height: 250px; margin: 0 -8px; border-radius: 14px; touch-action: none; }
  #pinlabels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .pin-label { position: absolute; left: 0; top: 0; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 999px; background: rgba(20, 18, 43, .72); color: #fff; white-space: nowrap; border-left: 3px solid var(--c); }
  .pin-label.sel { font-size: 11px; background: #fff; color: #24214a; z-index: 1; box-shadow: 0 2px 8px rgba(0, 0, 0, .35); }
  .hint { margin: 6px 0 0; font-size: 11px; color: var(--ink-faint); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .hint .lg { display: inline-flex; align-items: center; gap: 4px; }
  .hint .lg i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-soft); display: inline-block; }
  .hint .lg i.ghost { opacity: .45; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tile { background: rgba(0, 0, 0, .18); border-radius: 12px; padding: 8px 10px; }
  .tile b { display: block; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
  .tile span { font-size: 10.5px; color: var(--ink-faint); font-weight: 700; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 46px; margin: 12px 0 2px; }
  .bars i { flex: 1; height: 100%; display: flex; align-items: flex-end; }
  .bars i span { display: block; width: 100%; min-height: 2px; border-radius: 3px 3px 1px 1px; background: var(--c); opacity: .85; }
  .bars i span.zero { background: rgba(255, 255, 255, .07); opacity: 1; }
  .bars i:hover span { opacity: 1; filter: brightness(1.2); }
  .axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-faint); }
  .alltime { font-size: 11px; color: var(--ink-faint); margin-top: 8px; }
  .agents { list-style: none; margin: 0; padding: 0; }
  .agents li { display: grid; grid-template-columns: 10px 1fr auto; gap: 2px 9px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
  .agents li:first-child { border-top: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--idle); }
  .dot.help { background: var(--orange-hot); box-shadow: 0 0 0 3px rgba(255, 122, 69, .2); }
  .dot.working { background: var(--sky); }
  .dot.done { background: var(--mint); }
  .agents .what { min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agents .what small { display: block; font-weight: 500; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; }
  .agents .when { font-size: 11px; color: var(--ink-faint); display: flex; gap: 6px; align-items: center; }
  .muted { color: var(--ink-faint); font-size: 12px; }
  .hiddenpriv { font-style: italic; color: var(--ink-faint); }
  #empty { height: 100%; display: grid; place-items: center; color: var(--ink-faint); text-align: center; }

  /* ── agents view ── */
  #v-agents { padding: 14px 18px 18px; overflow-y: auto; display: block; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: 0 6px 24px rgba(10, 6, 30, .25); }
  th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-soft); padding: 10px 12px; background: rgba(0, 0, 0, .16); cursor: pointer; user-select: none; white-space: nowrap; }
  th.sorted::after { content: " ↓"; } th.sorted.asc::after { content: " ↑"; }
  th.nosort { cursor: default; }
  td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
  tr:hover td { background: rgba(255, 255, 255, .025); }
  .st { display: inline-flex; align-items: center; gap: 7px; font-weight: 800; font-size: 12px; white-space: nowrap; }
  .st.help { color: #ffb08a; }
  .proj { display: flex; align-items: center; gap: 8px; font-weight: 800; white-space: nowrap; }
  .proj i { width: 12px; height: 12px; border-radius: 4px; background: var(--c); flex: none; }
  .proj small { font-weight: 500; color: var(--ink-faint); }
  .doing { max-width: 420px; }
  .doing b { font-weight: 700; }
  .doing small { display: block; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 420px; }
  td.when { color: var(--ink-soft); white-space: nowrap; font-size: 12px; }
  td.act { text-align: right; white-space: nowrap; }

  #toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: #24214a; font-weight: 800; padding: 8px 14px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, .35); transition: opacity .2s, transform .25s var(--spring); pointer-events: none; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  ::-webkit-scrollbar { width: 9px; } ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .1); border-radius: 9px; border: 2px solid transparent; background-clip: padding-box; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="planet"></span>Crew</div>
  <nav class="tabs">
    <button data-view="projects" class="on">Projects <span class="n" id="n-projects">0</span></button>
    <button data-view="agents">Agents <span class="n" id="n-agents">0</span></button>
  </nav>
  <div class="spacer"></div>
  <div id="news"><span class="txt calm">Loading…</span></div>
  <div id="usage" hidden></div>
  <span id="conn" title="Connecting…"></span>
</header>

<main id="v-projects">
  <aside id="list">
    <div class="tools">
      <input id="filter" type="search" placeholder="Filter projects" autocomplete="off" />
      <select id="sort" aria-label="Sort projects">
        <option value="active">Most active (30d)</option>
        <option value="newest">Newest</option>
        <option value="name">Name</option>
        <option value="agents">Most agents</option>
      </select>
    </div>
    <ul id="plist"></ul>
  </aside>

  <section id="detail">
    <div id="empty">Pick a project on the left.</div>
    <div id="dwrap" hidden>
      <div class="grid">
        <div class="card preview">
          <div id="preview3d" title="Drag to turn · double-click to make it hop"></div>
          <div class="pv-cap" id="pvcap"></div>
        </div>
        <div class="card">
          <div class="namerow">
            <span class="sw" id="dsw"></span>
            <input id="dname" spellcheck="false" title="Rename (Enter to save)" />
            <span class="newb" id="dnew" hidden>NEW</span>
            <button class="btn small" id="dgotit" hidden>Got it</button>
          </div>
          <div class="meta" id="dmeta"></div>
          <div class="field"><label>Colour</label><div class="swatches" id="fcolor"></div></div>
          <div class="field"><label>Hat</label><div class="opts" id="fhat"></div></div>
          <div class="field"><label>Landmark</label><div class="opts" id="ftheme"></div></div>
          <div class="field"><label>On the planet</label>
            <label class="toggle"><input type="checkbox" id="fhidden" /><span class="k"></span><span id="fhiddenlab">Shown</span></label>
          </div>
        </div>
      </div>
      <div class="grid bottom">
        <div class="card spot">
          <h3>Spot on the planet <span class="r"><button class="btn small" id="spotreset">Reset</button></span></h3>
          <div style="position: relative">
            <div id="globe3d"></div>
            <div id="pinlabels"></div>
          </div>
          <p class="hint" id="spothint"></p>
        </div>
        <div class="card">
          <h3>Last 30 days</h3>
          <div id="dstats"></div>
          <h3 style="margin-top: 14px">Agents <span class="r muted" id="dagentsn"></span></h3>
          <ul class="agents" id="dagents"></ul>
        </div>
      </div>
    </div>
  </section>
</main>

<main id="v-agents" hidden>
  <table>
    <thead><tr>
      <th data-col="status">Status</th>
      <th data-col="project">Project</th>
      <th data-col="doing">What it's doing</th>
      <th data-col="since">Since</th>
      <th class="nosort"></th>
    </tr></thead>
    <tbody id="atable"></tbody>
  </table>
</main>

<div id="toast"></div>
<script type="module" src="/web/crew.js"></script>
</body>
</html>
